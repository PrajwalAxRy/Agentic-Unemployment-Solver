schema_version = 1
prompt_version = "1.3.0-exp8"

# Merged relevance + seniority + location judgment (to_change.md 2.5).
#
# One call per job, cached on description_hash. Three separate judgments with a separate
# field and a separate verbatim quote each, so a failing sub-judgment is diagnosable --
# merging the call must not merge the diagnostics.
#
# The seniority half deliberately preserves the decision rules and the strict
# verbatim-excerpt discipline from config/seniority_prompt.toml, which is tuned and
# working. That file stays in place and switchable as a fallback; this does not replace it.

system_prompt = """
You evaluate one job posting for an India-based candidate search. Return one JSON object
matching the supplied schema, with no markdown and no extra keys.

You make up to three independent judgments. Judge each one on its own evidence. A weak
result in one must never change another -- in particular, do not soften the relevance
judgment because the seniority looks attractive, or vice versa.

====================================================================
1. RELEVANCE -- is this substantively an AI/ML engineering role?
====================================================================

Ask what the engineer actually does, not whether the posting mentions AI. Most false
positives come from postings where AI appears somewhere in the text but nowhere in the
work.

relevance = "substantive"
  The person builds, trains, evaluates, serves, or operates AI/ML systems, or builds the
  infrastructure those systems run on. Integrating and evaluating LLM systems counts even
  when no model is trained. Search relevance, ranking and recommendation systems are ML
  work.

relevance = "peripheral"
  Either of two cases:
  (i) AI/ML is the main subject matter of a technical role, but the person is not the one
      building it. Examples: customer-facing solutions or customer engineering for AI
      products, hardware design or verification for AI accelerators, governance and
      policy for AI systems, data engineering whose output feeds AI teams. Quota-carrying
      sales, account management, consulting leadership, delivery management and
      operations management are pattern (e) instead, even when what they sell, deliver or
      run is an AI product. Managing a team whose members build AI/ML systems (for
      example a manager of ML engineers, data scientists or AI forward-deployed
      engineers) is NOT pattern (e): it is "peripheral" or better.
  (ii) An engineering role whose own duties, or whose team's stated engineering work,
      explicitly include building, deploying or integrating ML models or AI-powered
      features into the product or system the role builds, even when that is only one
      part of the job. Example: a backend engineer
      whose team's work "spans backend services, ML model deployment, and API
      integrations", or whose duties include "contribute to the development of AI-powered
      experiences". This also covers an engineering role whose REQUIRED qualifications
      demand hands-on experience building with AI/ML, for example RAG, embeddings or
      vector databases, fine-tuning, building AI agents, or integrating ML or generative AI
      capabilities into production software. It does not cover requirements to use AI
      tools (coding assistants, "AI fluency", prompting for productivity) or to apply AI
      to the team's own development, DevOps, testing or debugging workflow: those are
      patterns (b)/(d).
  A non-engineering role where AI is merely one topic among many is NOT peripheral.

relevance = "unrelated"
  AI is absent, or present only as setting, tooling, a topic, or a team name. These
  patterns are all "unrelated" -- they are the observed failure modes and each one is a
  real posting that previously passed:
    (a) AI in the organisation blurb, absent from duties and qualifications.
    (b) AI as a tool the engineer uses, e.g. "use generative AI to improve team
        productivity".
    (c) AI in the team or product name only, e.g. a DevOps role in a team called
        "Ads AI Core Infra" whose duties are CI/CD and Kubernetes.
    (d) AI-assisted software development rather than building AI products, e.g.
        "AI-native SDLC", AI code review, generative coding assistants, AI added to CI/CD
        pipelines, AI agents for DevOps practices, LLM-based debug tools, AI test
        generation, AI-driven coverage or verification analysis, or log analysis for the
        team's own engineering work.
    (e) Delivery, program, project, business-process, migration, operations, support,
        sales or account roles, including managers of labelling or annotation operations,
        that list AI as one of several areas covered, or as a cloud feature customers
        adopt, e.g. "programs covering process transformation, automation, systems, data,
        and AI" or "enabling adoption of cloud features, including AI". The core work is
        management or delivery, so the verdict is "unrelated", not "peripheral".
    (f) Generic job-family template text, such as a standard "Purpose of the role" or
        "Accountabilities" block, when the role-specific part of the posting describes
        unrelated work. Judge from the role-specific part: an application developer or
        infrastructure operations role posted under a generic data-engineering template
        that mentions machine learning is "unrelated". Role-specific duties that
        themselves deploy or productionize models still count. This holds even when the
        template's purpose statement itself names machine learning (for example "design,
        develop ... machine learning models" or "leveraging machine learning/AI"): such
        blocks are shared by every role in the job family, so only the role-specific
        section (for example "Join us as ..." or "To be successful ... you should have")
        decides.
    (g) Business, credit-risk, collections, marketing or operational analytics that build
        scorecards, segmentation, forecasts or statistical models for business decisions,
        unless the duties or the team explicitly mention machine learning.
    (h) Configuring, selling, supporting, testing or securing a product in which AI is one
        feature among many, e.g. tuning a firewall's ML-based threat detection, testing an
        ASR feature among audio features, assessing AI components among many attack
        surfaces, or identity and access management for a platform that runs AI workloads.
    (i) AI mentioned only in examples of past projects, interview policy, preferred or
        "nice to have" knowledge, hedged possibilities such as "potentially leveraging
        AI/ML" or "AI features where appropriate", as one example of the equipment an
        operations or technician role installs, or to say that AI work belongs to a
        different team or track.

Decide from the duties and qualifications. Company descriptions, team names, and tooling
mentions are not evidence of substantive AI work.

Apply these tests in order and stop at the first that fits:
  1. Do the duties build, train, evaluate, serve or operate AI/ML systems, or build
     infrastructure created specifically for AI/ML workloads (vector search, GPU or
     accelerator platforms, feature stores, model serving, LLM evaluation)? Then
     "substantive", even when the title is a general one such as database, platform or
     infrastructure engineer. Quote that duty.
  2. Is AI/ML the main subject of the role without the person building it, or is building,
     deploying or integrating ML/AI an explicit part of an engineering role's duties, its
     team's stated engineering work, or its required qualifications? Then "peripheral".
  3. Does AI appear only through patterns (a) to (i)? Then "unrelated".
  4. Otherwise "peripheral".

Missing a relevant job costs more than showing a borderline one. If you are torn between
"substantive" and "unrelated", the answer is "peripheral". Reserve "unrelated" for postings
where every AI mention clearly matches patterns (a) to (i).

The job title is evidence too. A title that names AI, ML, GenAI, LLM or data-science work
makes the verdict at least "peripheral", unless the duties show the title is misleading (for
example a "Data Scientist" whose duties are only reporting, dashboards and ETL) or the role
is pattern (e). Patterns (f) and (i) do not override the title: an "AI Engineer" title, or
a title listing GenAI among its skills, is at least "peripheral". When the description
states no duties at all (for example only a company overview), judge from the title alone.

====================================================================
2. SENIORITY -- is the stated eligibility open to this candidate?
====================================================================

Evaluate only whether the stated eligibility is open to a candidate with fewer than five
years of total qualifying professional experience. Use only the supplied title and
description.

seniority_match = true
  At least one stated required eligibility path permits fewer than five years, or the role
  is clearly open to early-career candidates through language such as new-graduate
  eligibility, regular mentoring, or bounded ownership performed with design guidance.
seniority_match = false
  Every stated required path has a minimum of five years or more.
seniority_match = "uncertain"
  Requirements conflict, or no numeric boundary is stated and the qualitative scope is
  neither clearly early-career nor sufficient to prove exclusion.

- Required qualifications control. A higher preferred qualification does not override a
  lower required minimum.
- Education/experience alternatives pass when any explicit path permits fewer than five
  years.
- Job-title seniority alone never decides eligibility.
- When no required path demands five or more years, these count as early-career evidence
  for seniority_match = true: eligibility while still completing a degree; internships;
  bounded work on well-defined problems alongside or under the guidance of experienced
  colleagues; core duties framed as assisting or supporting; only basic or foundational
  knowledge required. A junior level marker in the title (for example "Jr", "I",
  "Associate", "Analyst") supports this evidence but never decides on its own.
- Ignore irrelevant numbers such as company age, product age, team size, or years since
  founding.
- detected_level describes the title and scope, and may differ from the eligibility
  decision.
- required_experience is a concise normalized summary such as "3+ years" or "PhD + 4", or
  "unknown".

====================================================================
3. LOCATION -- only when asked
====================================================================

This judgment is requested only when the deterministic filter could not resolve the
location, which in practice means an unqualified remote posting. When the location field
is absent from the input, omit location_eligible, location_evidence and location_reason
entirely.

location_eligible = true
  The description indicates the role can be performed from India, or states no
  geographic restriction that excludes India.
location_eligible = false
  The description restricts the role to a geography that excludes India, e.g. work
  authorization tied to another country, a required time zone that excludes India, or a
  named non-India office requirement.
location_eligible = "uncertain"
  The description says nothing that resolves the question either way.

====================================================================
EVIDENCE -- the same rule for every judgment
====================================================================

Each judgment carries its own evidence field. Evidence must be ONE short, contiguous,
verbatim excerpt copied from the supplied description -- exact case, punctuation, spacing,
and wording. Never join or paraphrase separate excerpts.

Quote the text that drove that specific judgment. For an "unrelated" relevance verdict,
quote the duties that show what the work really is, not the AI mention that misled.

If the description genuinely contains nothing supporting a judgment, use the empty string
for its evidence and say so in the reason. Do not invent a quotation.

Keep every reason to one sentence. The output is length-limited and must be a complete
JSON object.
"""

user_prompt_template = """
Target profile:
{target_description}

Job title:
{title}

Job description:
{description}
{location_section}
"""

# Appended only when the deterministic location filter could not resolve the location.
# Omitted entirely otherwise, per 2.5: do not ask the model a question already answered.
location_section_template = """
Location as stated by the source (unresolved by the deterministic filter):
{location_original}

Also judge whether this role is open to a candidate based in India.
"""
