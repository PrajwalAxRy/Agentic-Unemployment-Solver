<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Benchmark label review</title>
<style>
  :root { --ok:#1b7f3b; --chg:#b26a00; --muted:#666; --line:#ddd; --sel:#2a5bd7; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, Segoe UI, sans-serif; color:#222; display:flex; height:100vh; }
  #side { width:340px; border-right:1px solid var(--line); overflow-y:auto; background:#fafafa; }
  #side header { padding:12px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fafafa; }
  #side h1 { font-size:15px; margin:0 0 6px; }
  #progress { color:var(--muted); font-size:12px; }
  .tools { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  button { font:inherit; }
  .tools button { padding:4px 8px; border:1px solid #bbb; background:#fff; border-radius:4px; cursor:pointer; }
  .sec { padding:8px 14px 4px; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; }
  .item { padding:7px 14px; border-bottom:1px solid #eee; cursor:pointer; display:flex; gap:8px; align-items:center; }
  .item:hover { background:#f0f0f0; }
  .item.active { background:#e8eefc; }
  .item .t { flex:1; font-size:13px; }
  .item .t span { color:var(--muted); font-size:12px; }
  .badge { font-size:11px; padding:1px 7px; border-radius:10px; color:#fff; font-weight:600; white-space:nowrap; }
  .b-ok { background:var(--ok); } .b-chg { background:var(--chg); } .b-none { background:#aaa; }
  #main { flex:1; overflow-y:auto; padding:18px 26px 60px; }
  #main h2 { margin:0 0 4px; font-size:19px; }
  .label { margin:12px 0; padding:10px 12px; background:#f4f7ff; border:1px solid #dbe4ff; border-radius:5px; max-width:950px; }
  .label .why { margin-top:4px; }
  .field { display:flex; gap:6px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .field .name { width:90px; font-weight:600; }
  .field button { padding:4px 11px; border:1px solid #bbb; background:#fff; border-radius:4px; cursor:pointer; }
  .field button.mine { border-color:var(--sel); }
  .field button.on { background:var(--sel); border-color:var(--sel); color:#fff; }
  .actions { display:flex; gap:8px; margin:12px 0; }
  .actions button { padding:7px 16px; border-radius:5px; border:2px solid var(--ok); background:#fff; color:var(--ok); font-weight:600; cursor:pointer; }
  .actions button.next { border-color:#888; color:#444; }
  textarea { width:100%; max-width:950px; min-height:46px; font:inherit; padding:6px; border:1px solid #ccc; border-radius:4px; }
  .jd { margin-top:12px; max-width:950px; padding:8px 10px; background:#fcfcfc; border:1px solid #eee; }
  .jd .hit { background:#fff6c7; }
  .jd b { color:#7a3e00; }
  .muted { color:var(--muted); }
  .help { color:var(--muted); font-size:12.5px; max-width:950px; }
  details.policy { max-width:950px; margin:8px 0; font-size:13px; }
  details.policy li { margin:2px 0; }
</style>
</head>
<body>
<div id="side">
  <header>
    <h1>Benchmark label review</h1>
    <div id="progress"></div>
    <div class="tools">
      <button id="export">Export review</button>
      <button id="import">Import</button>
      <input id="importFile" type="file" accept=".json" style="display:none">
      <button id="reset">Reset</button>
    </div>
  </header>
  <div id="list"></div>
</div>
<div id="main"></div>
<script>
const DATA = /*__DATA__*/null;
const KEY = "label_review_" + DATA.batch;
const FIELDS = {
  relevance: ["core", "involved", "uncertain", "hide"],
  seniority: ["yes", "no", "uncertain"],
  location: ["india", "open_remote", "relocation", "excluded", "uncertain"],
};
const SECTION = {low: "Low confidence (5 or below)", sample: "Random check of confident labels"};
let state = JSON.parse(localStorage.getItem(KEY) || "{}");
let current = 0;

function save() { localStorage.setItem(KEY, JSON.stringify(state)); renderList(); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

const STRICT = /\b(AI|ML|LLMs?|GenAI|RAG|NLP|MCP|AIOps)\b/;
const LOOSE = /\b(artificial intelligence|machine learning|deep learning|generative|agentic|agents?|data scien\w*|predictive|neural|computer vision|fine-?tun\w*|embeddings?|vector databases?|copilot|chatgpt|claude|prompt\w*|large language|recommendation|anomaly detection|models?)\b/i;
const YEARS = /(\d+\s*(\+|-|–|to)?\s*\d*\s*\+?\s*(years?|yrs))/gi;
function highlight(text) {
  return text.split(/(?<=[.!?])\s+/).map(sentence => {
    let h = esc(sentence);
    const hit = STRICT.test(sentence) || LOOSE.test(sentence);
    h = h.replace(new RegExp(STRICT.source, "g"), "<b>$1</b>")
         .replace(new RegExp(LOOSE.source, "gi"), "<b>$1</b>")
         .replace(YEARS, "<u>$1</u>");
    return hit ? `<span class="hit">${h}</span>` : h;
  }).join(" ");
}

// A job's review: {status: "agree" | "changed", relevance?, seniority?, location?, note?}
function review(o) { return state[o] || {}; }
function changed(job) {
  const r = review(job.ordinal);
  return ["relevance", "seniority", "location"].some(f => r[f] && r[f] !== job.label[f]);
}
function status(job) {
  const r = review(job.ordinal);
  if (changed(job)) return "chg";
  return r.status === "agree" ? "ok" : "none";
}

function renderList() {
  const done = DATA.jobs.filter(j => status(j) !== "none").length;
  const chg = s => DATA.jobs.filter(j => j.section === s && status(j) === "chg").length;
  const sampleDone = DATA.jobs.filter(j => j.section === "sample" && status(j) !== "none").length;
  document.getElementById("progress").innerHTML =
    `${done} of ${DATA.jobs.length} reviewed · changed: ${chg("low")} low-confidence, ` +
    `${chg("sample")} of ${sampleDone} sampled · saved in this browser`;
  let html = "", last = "";
  DATA.jobs.forEach((j, i) => {
    if (j.section !== last) { html += `<div class="sec">${SECTION[j.section]}</div>`; last = j.section; }
    const s = status(j);
    html += `<div class="item ${i === current ? "active" : ""}" data-i="${i}">
      <div class="t">${esc(j.title)}<br><span>${esc(j.company)} · #${j.ordinal}</span></div>
      <span class="badge b-${s}">${s === "ok" ? "agree" : s === "chg" ? "changed" : "to do"}</span></div>`;
  });
  document.getElementById("list").innerHTML = html;
  document.querySelectorAll(".item").forEach(el => el.onclick = () => { current = +el.dataset.i; render(); });
}

function fieldRow(job, field) {
  const mine = job.label[field];
  const picked = review(job.ordinal)[field] || mine;
  return `<div class="field"><span class="name">${field}</span>` + FIELDS[field].map(v =>
    `<button data-f="${field}" data-v="${v}" class="${v === mine ? "mine" : ""} ${v === picked ? "on" : ""}">${v}</button>`
  ).join("") + `<span class="muted">(Claude: ${esc(mine)})</span></div>`;
}

function render() {
  renderList();
  const j = DATA.jobs[current];
  const r = review(j.ordinal);
  const asked = j.location !== null && j.location !== undefined;
  document.getElementById("main").innerHTML = `
    <h2>${esc(j.title)}</h2>
    <div class="muted">${esc(j.company)} · #${j.ordinal} · ${SECTION[j.section]}
      ${asked ? ` · <b>location asked:</b> ${esc(j.location)}` : ""}</div>
    <div class="label"><b>Claude's label:</b> relevance <b>${esc(j.label.relevance)}</b> ·
      seniority <b>${esc(j.label.seniority)}</b>${asked ? ` · location <b>${esc(j.label.location)}</b>` : ""} ·
      confidence <b>${j.label.conf}</b>/10
      <div class="why">${esc(j.label.reason)}</div></div>
    ${fieldRow(j, "relevance")}${fieldRow(j, "seniority")}${asked ? fieldRow(j, "location") : ""}
    <div class="actions"><button class="agree">Done, next (a)</button><button class="next">Skip (n)</button></div>
    <textarea id="note" placeholder="Why you changed it, or a rule you want (optional)">${esc(r.note || "")}</textarea>
    <details class="policy"><summary>Policy v1.1 in brief</summary><ul>
      <li><b>core</b>: ML/GenAI/LLM engineers and scientists, MLOps, ML platform/inference/GPU infra, engineers building agents.</li>
      <li><b>involved</b>: duties build or deploy ML/AI features; required hands-on AI building; customer/solutions engineers who build or deploy the company's AI; analytics "Data Scientist"; AI chip design; AI evaluation as the core job; quant roles naming ML.</li>
      <li><b>uncertain</b>: AI org only; mostly traditional role with a smaller AI requirement; preferred-only AI tied to duties; consultants/architects designing AI among other work; AI product managers; AI governance/security oversight; integrating someone else's AI; statistics without ML.</li>
      <li><b>hide</b>: AI only in company text or templates; using AI tools; hedges; data engineering that feeds ML; annotation; sales/customer roles that don't touch AI; ordinary SWE on an AI product; product/UX designers of AI; data-centre technicians.</li>
      <li><b>seniority yes</b>: any required path under 5 years; interns/graduates; no years plus a junior marker. <b>no</b>: all paths 5+; no years plus Lead/Staff/Principal/Manager/VP. <b>uncertain</b>: no years with "Senior" or no marker; contradictions. A number beats the title.</li>
    </ul></details>
    <p class="help">Blue outline = Claude's answer; filled = your answer. Click a different value to correct it, then "Done".
      AI-related sentences are highlighted; experience years are underlined.</p>
    <div class="jd">${highlight(j.description)}</div>`;
  document.querySelectorAll(".field button").forEach(b => b.onclick = () => {
    const rec = Object.assign({}, review(j.ordinal));
    rec[b.dataset.f] = b.dataset.v === j.label[b.dataset.f] ? undefined : b.dataset.v;
    state[j.ordinal] = rec; save(); render();
  });
  document.getElementById("note").oninput = e => {
    state[j.ordinal] = Object.assign({}, review(j.ordinal), {note: e.target.value}); save();
  };
  document.querySelector(".agree").onclick = done;
  document.querySelector(".next").onclick = next;
}

function done() {
  const j = DATA.jobs[current];
  state[j.ordinal] = Object.assign({}, review(j.ordinal), {status: "agree"}); save(); next();
}
function next() { if (current < DATA.jobs.length - 1) current++; render(); document.getElementById("main").scrollTop = 0; }
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "a") done();
  if (e.key === "n") next();
});

document.getElementById("export").onclick = () => {
  const out = {batch: DATA.batch, exported_at: new Date().toISOString(), jobs: {}};
  DATA.jobs.forEach(j => {
    const r = review(j.ordinal);
    if (status(j) === "none" && !r.note) return;
    out.jobs[j.ordinal] = {section: j.section, half: j.half, company: j.company, title: j.title,
      claude: j.label, reviewed: status(j) !== "none", changed: changed(j),
      relevance: r.relevance || j.label.relevance, seniority: r.seniority || j.label.seniority,
      location: r.location || j.label.location, note: r.note || ""};
  });
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `label_review_${DATA.batch}.json`; a.click();
};
document.getElementById("import").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(text => {
    const data = JSON.parse(text);
    state = {};
    Object.entries(data.jobs || {}).forEach(([o, v]) => {
      const rec = {note: v.note || ""};
      if (v.reviewed) rec.status = "agree";
      ["relevance", "seniority", "location"].forEach(f => { if (v[f] !== v.claude[f]) rec[f] = v[f]; });
      state[o] = rec;
    });
    save(); render();
  });
};
document.getElementById("reset").onclick = () => {
  if (confirm("Clear every review saved in this browser?")) { state = {}; save(); render(); }
};
render();
</script>
</body>
</html>
