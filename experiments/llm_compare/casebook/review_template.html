<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Casebook review: borderline AI/ML jobs</title>
<style>
  :root { --show:#1b7f3b; --uncertain:#b26a00; --hide:#8a1c1c; --muted:#666; --line:#ddd; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, Segoe UI, sans-serif; color:#222; display:flex; height:100vh; }
  #side { width:330px; border-right:1px solid var(--line); overflow-y:auto; background:#fafafa; }
  #side header { padding:12px 14px; border-bottom:1px solid var(--line); }
  #side h1 { font-size:15px; margin:0 0 6px; }
  #progress { color:var(--muted); font-size:12px; }
  .tools { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  button, select { font:inherit; }
  .tools button { padding:4px 8px; border:1px solid #bbb; background:#fff; border-radius:4px; cursor:pointer; }
  .type { padding:9px 14px; border-bottom:1px solid #eee; cursor:pointer; }
  .type:hover { background:#f0f0f0; }
  .type.active { background:#e8eefc; }
  .type .t { font-weight:600; }
  .type .meta { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; margin-top:2px; }
  .badge { font-size:11px; padding:1px 7px; border-radius:10px; color:#fff; font-weight:600; }
  .b-show { background:var(--show); } .b-uncertain { background:var(--uncertain); } .b-hide { background:var(--hide); }
  .b-none { background:#aaa; }
  #main { flex:1; overflow-y:auto; padding:18px 26px 60px; }
  #main h2 { margin:0 0 6px; font-size:19px; }
  .desc { max-width:900px; }
  .suggest { margin:10px 0; padding:8px 12px; background:#f6f6f6; border-left:4px solid #999; max-width:900px; }
  .decide { display:flex; gap:8px; align-items:center; margin:12px 0 6px; }
  .decide button { padding:7px 16px; border-radius:5px; border:2px solid; background:#fff; cursor:pointer; font-weight:600; }
  .decide .show { border-color:var(--show); color:var(--show); }
  .decide .uncertain { border-color:var(--uncertain); color:var(--uncertain); }
  .decide .hide { border-color:var(--hide); color:var(--hide); }
  .decide button.on.show { background:var(--show); color:#fff; }
  .decide button.on.uncertain { background:var(--uncertain); color:#fff; }
  .decide button.on.hide { background:var(--hide); color:#fff; }
  textarea { width:100%; max-width:900px; min-height:46px; font:inherit; padding:6px; border:1px solid #ccc; border-radius:4px; }
  .job { border:1px solid var(--line); border-radius:6px; margin:12px 0; max-width:1000px; }
  .job .head { padding:9px 12px; display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
  .job .head:hover { background:#fafafa; }
  .job .ttl { flex:1; }
  .job .ttl b { font-size:14.5px; }
  .job .why { color:var(--muted); font-size:12.5px; }
  .anchor { font-size:11px; background:#e5e5e5; padding:1px 6px; border-radius:8px; margin-left:6px; }
  .job .body { display:none; padding:0 12px 12px; border-top:1px solid #eee; }
  .job.open .body { display:block; }
  .jd { margin-top:10px; max-height:420px; overflow-y:auto; padding:8px 10px; background:#fcfcfc; border:1px solid #eee; white-space:pre-wrap; }
  .jd .hit { background:#fff6c7; }
  .jd b { color:#7a3e00; }
  .row { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .reveal { margin-top:10px; font-size:13px; background:#f4f7ff; border:1px solid #dbe4ff; padding:8px 10px; border-radius:4px; display:none; }
  .reveal.on { display:block; }
  .reveal .m { margin:4px 0; }
  .muted { color:var(--muted); }
  .ov { font-size:12px; }
  .help { color:var(--muted); font-size:12.5px; max-width:900px; }
</style>
</head>
<body>
<div id="side">
  <header>
    <h1>Borderline AI/ML jobs</h1>
    <div id="progress"></div>
    <div class="tools">
      <button id="export">Export decisions</button>
      <button id="import">Import</button>
      <input id="importFile" type="file" accept=".json" style="display:none">
      <button id="reset">Reset</button>
    </div>
  </header>
  <div id="types"></div>
</div>
<div id="main"></div>
<script>
const DATA = /*__DATA__*/null;
const KEY = "casebook_review_" + DATA.version;
const LABEL = {show: "Show", uncertain: "Uncertain", hide: "Hide"};
let state = JSON.parse(localStorage.getItem(KEY) || '{"types":{},"jobs":{}}');
let current = DATA.types[0].key;

function save() { localStorage.setItem(KEY, JSON.stringify(state)); renderSide(); }
function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

const STRICT = /\b(AI|ML|LLMs?|GenAI|RAG|NLP|MCP|AIOps)\b/;
const LOOSE = /\b(artificial intelligence|machine learning|deep learning|generative|agentic|agents?|data scien\w*|predictive|neural|computer vision|fine-?tun\w*|embeddings?|vector databases?|copilot|chatgpt|claude|prompt\w*|large language|recommendation|anomaly detection)\b/i;
function highlight(text) {
  return text.split(/(?<=[.!?])\s+/).map(sentence => {
    let h = esc(sentence);
    const hit = STRICT.test(sentence) || LOOSE.test(sentence);
    h = h.replace(new RegExp(STRICT.source, "g"), "<b>$1</b>")
         .replace(new RegExp(LOOSE.source, "gi"), "<b>$1</b>");
    return hit ? `<span class="hit">${h}</span>` : h;
  }).join(" ");
}

function typeDecision(key) { return (state.types[key] || {}).decision; }

function renderSide() {
  const decided = DATA.types.filter(t => typeDecision(t.key)).length;
  const overrides = Object.values(state.jobs).filter(j => j.override).length;
  document.getElementById("progress").textContent =
    `${decided} of ${DATA.types.length} types decided · ${overrides} job overrides · saved in this browser`;
  document.getElementById("types").innerHTML = DATA.types.map(t => {
    const d = typeDecision(t.key);
    return `<div class="type ${t.key === current ? "active" : ""}" data-key="${t.key}">
      <div class="t">${esc(t.title)}</div>
      <div class="meta"><span>${t.jobs.length} jobs · suggested: ${LABEL[t.suggest]}</span>
      <span class="badge b-${d || "none"}">${d ? LABEL[d] : "to decide"}</span></div></div>`;
  }).join("");
  document.querySelectorAll(".type").forEach(el => el.onclick = () => { current = el.dataset.key; render(); });
}

function modelLines(name, view) {
  if (!view.answers.length) return `<div class="m"><b>${name}:</b> <span class="muted">no answer recorded</span></div>`;
  const counts = {};
  view.answers.forEach(a => counts[a.relevance] = (counts[a.relevance] || 0) + 1);
  const tally = Object.entries(counts).map(([k, v]) => `${k} ×${v}`).join(", ");
  const first = view.answers[0];
  return `<div class="m"><b>${name}</b> <span class="muted">(${esc(view.source)})</span>: ${tally}
    <div class="muted">“${esc(first.evidence)}” — ${esc(first.reason)}</div></div>`;
}

function render() {
  renderSide();
  const t = DATA.types.find(x => x.key === current);
  const d = typeDecision(t.key);
  const note = (state.types[t.key] || {}).note || "";
  const jobsHtml = t.jobs.map(id => {
    const j = DATA.jobs[id];
    const js = state.jobs[id] || {};
    return `<div class="job" data-id="${id}">
      <div class="head"><div class="ttl"><b>${esc(j.title)}</b> <span class="muted">· ${esc(j.company)} · batch ${id.split(":")[0]}</span>
        ${j.anchor ? '<span class="anchor">clear-cut example</span>' : ""}
        <div class="why">${esc(j.claude.note)}</div></div>
        <span class="badge b-${js.override || "none"}">${js.override ? LABEL[js.override] : "follows type"}</span></div>
      <div class="body">
        <div class="row ov">Override for this job:
          <select class="override"><option value="">follow the type decision</option>
          <option value="show">Show</option><option value="uncertain">Uncertain</option><option value="hide">Hide</option></select>
          <label><input type="checkbox" class="revealBox"> reveal Claude / Luna / Sol answers</label></div>
        <div class="reveal">
          <div class="m"><b>Claude (hand verdict):</b> ${esc(j.claude.relevance || "?")} <span class="muted">(${esc(j.claude.conf || "?")} confidence)</span></div>
          ${modelLines("Luna", j.luna)}${modelLines("Sol", j.sol)}</div>
        <textarea class="jobnote" placeholder="Note on this job (optional)">${esc(js.note || "")}</textarea>
        <div class="jd">${highlight(j.description)}</div>
      </div></div>`;
  }).join("");
  document.getElementById("main").innerHTML = `
    <h2>${esc(t.title)}</h2>
    <div class="desc">${esc(t.description)}</div>
    <div class="suggest"><b>Suggested: ${LABEL[t.suggest]}.</b> ${esc(t.why)}</div>
    <div class="decide">Your decision for this type:
      ${["show", "uncertain", "hide"].map(v => `<button class="${v} ${d === v ? "on" : ""}" data-v="${v}">${LABEL[v]}</button>`).join("")}</div>
    <textarea id="typenote" placeholder="Note for this type, e.g. 'only if they build it, not sell it' or 'split this type'">${esc(note)}</textarea>
    <p class="help">Show = list it as a match. Uncertain = list it, marked uncertain. Hide = leave it out.
      Click a job to read it; AI-related sentences are highlighted. Override a job only when it does not fit the type's decision.</p>
    ${jobsHtml}`;
  document.querySelectorAll(".decide button").forEach(b => b.onclick = () => {
    state.types[t.key] = Object.assign(state.types[t.key] || {}, {decision: b.dataset.v}); save(); render();
  });
  document.getElementById("typenote").oninput = e => {
    state.types[t.key] = Object.assign(state.types[t.key] || {}, {note: e.target.value}); save();
  };
  document.querySelectorAll(".job").forEach(el => {
    const id = el.dataset.id;
    el.querySelector(".head").onclick = () => el.classList.toggle("open");
    const sel = el.querySelector(".override");
    sel.value = (state.jobs[id] || {}).override || "";
    sel.onchange = () => {
      state.jobs[id] = Object.assign(state.jobs[id] || {}, {override: sel.value || undefined}); save();
      el.querySelector(".head .badge").outerHTML = `<span class="badge b-${sel.value || "none"}">${sel.value ? LABEL[sel.value] : "follows type"}</span>`;
    };
    el.querySelector(".revealBox").onchange = e => el.querySelector(".reveal").classList.toggle("on", e.target.checked);
    el.querySelector(".jobnote").oninput = e => {
      state.jobs[id] = Object.assign(state.jobs[id] || {}, {note: e.target.value}); save();
    };
  });
}

document.getElementById("export").onclick = () => {
  const out = {version: DATA.version, exported_at: new Date().toISOString(), types: {}, jobs: {}};
  DATA.types.forEach(t => out.types[t.key] = {title: t.title, suggest: t.suggest,
    decision: typeDecision(t.key) || null, note: (state.types[t.key] || {}).note || ""});
  Object.entries(state.jobs).forEach(([id, js]) => {
    if (!js.override && !js.note) return;
    const j = DATA.jobs[id];
    out.jobs[id] = {override: js.override || null, note: js.note || "", company: j.company,
      title: j.title, job_key: j.job_key, type: DATA.types.find(t => t.jobs.includes(id)).key};
  });
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "casebook_decisions.json"; a.click();
};
document.getElementById("import").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(text => {
    const data = JSON.parse(text);
    state = {types: {}, jobs: {}};
    Object.entries(data.types || {}).forEach(([k, v]) => state.types[k] = {decision: v.decision || undefined, note: v.note || ""});
    Object.entries(data.jobs || {}).forEach(([k, v]) => state.jobs[k] = {override: v.override || undefined, note: v.note || ""});
    save(); render();
  });
};
document.getElementById("reset").onclick = () => {
  if (confirm("Clear every decision saved in this browser?")) { state = {types: {}, jobs: {}}; save(); render(); }
};
render();
</script>
</body>
</html>
