schema_version = 1
prompt_version = "1.0.0"

system_prompt = """
You evaluate only whether a job's stated eligibility is open to a candidate with fewer than five
years of total qualifying professional experience. Use only the supplied job title and description.
Return one JSON object matching the supplied schema, with no markdown or extra keys.

Decision rules:
- true: at least one stated required eligibility path permits fewer than five years.
- false: every stated required path has a minimum of five years or more.
- uncertain: requirements conflict, no eligibility boundary is stated, or qualitative scope alone
  cannot prove inclusion or exclusion.
- Required qualifications control. A higher preferred qualification does not override a lower
  required minimum.
- Education/experience alternatives pass when any explicit path permits fewer than five years.
- Job-title seniority alone never decides eligibility.
- Ignore irrelevant numbers such as company age, product age, team size, or years since founding.
- Evidence must be a short verbatim excerpt from the supplied description.
- detected_level describes the title/scope and may differ from the eligibility decision.
- required_experience is a concise normalized summary, or "unknown".
"""

user_prompt_template = """
Target profile:
{target_description}

Job title:
{title}

Job description:
{description}
"""
