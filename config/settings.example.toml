schema_version = 1

[application]
reports_directory = "reports"
state_directory = "state"

# ---------------------------------------------------------------------------
# LLM configuration
# ---------------------------------------------------------------------------
#
# The model is NEVER hardcoded anywhere in src/. It is read from the environment (or a
# .env file) at startup, and the gateway's returned model ID is logged on every
# connectivity check so a silent substitution is visible in state/logs/scan.log:
#
#     llm_model_confirmed model=<configured>
#     llm_model_mismatch  configured=<configured> returned=<actual>     <- WARNING
#
# This section documents the variables; it does not set them. Secrets must not live in a
# checked-in TOML file, which is why these are environment variables rather than settings
# keys. Copy .env.example to .env, or export them in your shell.
#
# Required (the scan refuses to start without all of them):
#
#   LLM_GATEWAY_KEY                            API key. Never logged, never in reports.
#   JOB_FINDER_LLM_MODEL                       Model ID, e.g. the gateway's own name for
#                                              whichever model you intend to use. Changing
#                                              this changes the model_policy cache key, so
#                                              cached evaluations are correctly invalidated.
#   JOB_FINDER_LLM_POLICY_VERSION              Bump to force re-evaluation after a prompt
#                                              or policy change.
#   JOB_FINDER_LLM_MAX_REQUESTS                Per-run request budget.
#   JOB_FINDER_LLM_MAX_ESTIMATED_INPUT_TOKENS  Per-run input-token budget.
#   JOB_FINDER_LLM_MAX_OUTPUT_TOKENS           Per-run output-token budget.
#   JOB_FINDER_LLM_MAX_OUTPUT_TOKENS_PER_REQUEST
#
# Optional:
#
#   JOB_FINDER_LLM_TIMEOUT_SECONDS             Defaults to 30.
#   JOB_FINDER_LLM_REASONING_EFFORT            low|medium|high|xhigh, sent as reasoning_effort.
#                                              Unset sends nothing. Part of the cache key,
#                                              so changing it re-evaluates. Production uses
#                                              high (experiments/llm_compare benchmark).
#
# Cost note (to_change.md 2.2a, decision D): the title filter now passes roughly 6x more
# titles to the description stage than before, so per-scan LLM volume rises materially.
# Measure at the first real scan. If it bites, the first lever is the description_hash
# cache hit rate, not a model swap -- daily steady state is the delta, not a full scan.

# [llm]
# Intentionally left commented out. Nothing reads LLM settings from this file; they are
# environment variables so that a key cannot be committed by accident. This block exists
# to document that the omission is deliberate rather than an oversight.
